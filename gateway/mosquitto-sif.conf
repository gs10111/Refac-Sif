# ----------------------------------------------------------------------------
# Broker local do pipeline SIF — roda na mesma máquina do servidor TCP.
#
#   sudo cp mosquitto-sif.conf /etc/mosquitto/conf.d/sif.conf
#   sudo systemctl restart mosquitto
#
# NÃO redefina aqui nada que o /etc/mosquitto/mosquitto.conf principal já
# defina (em especial `persistence` e `persistence_location`): valor duplicado
# é ERRO FATAL para o Mosquitto e o serviço não sobe.
#
# Globais primeiro, listener por último: no Mosquitto 2.x tudo que vem depois de
# um `listener` é lido como opção daquele listener.
# ----------------------------------------------------------------------------

# ---- Globais (antes do listener) ----

# Blocos de 100 amostras dão ~13 KB. A folga cobre variação de payload.
# `max_packet_size` substitui o `message_size_limit`, que o 2.x marca deprecado.
max_packet_size 262144

# Uma captura de 5 min a 200 Hz gera 600 mensagens em rajada, e o gateway pode
# estar ocupado escoando o buffer. Fila generosa evita descarte no pico.
max_queued_messages 10000

# ---- Listener (último bloco) ----

# Só loopback: o produtor (server.tcp_server) e o consumidor (tb-gateway, com
# network_mode host) estão nesta máquina. O broker não tem autenticação — não
# expô-lo à rede é o que torna isso aceitável.
listener 1883 127.0.0.1
allow_anonymous true
