; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico32]
platform = espressif32
board = pico32
build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; Host build for the pure (Arduino-free) modules under lib/.
; Run with:  pio test -e native
;
; src/ is deliberately NOT compiled here (test_build_src defaults to no) — it is
; the Arduino wiring layer. Anything worth unit-testing lives under lib/ and must
; not include Arduino.h, SPI.h, WiFi.h or esp_*; if it does, this build breaks,
; which is the point.
;
; The same test/ tree runs on target with `pio test -e pico32` for the checks that
; are genuinely hardware-only.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -DUNIT_TEST
lib_ignore = ICM42688P

; Mutation harness. Same tests, same tree, deliberately broken implementations
; behind -DMUTANT_* flags. A passing suite proves the tests CAN pass; running them
; against a known-wrong implementation is the only thing that proves they can
; DETECT. Failures here are the pass condition.
;
; ONE ENV PER MUTATION, exactly one -DMUTANT_* flag each. Not one env carrying
; every flag: results stay unconflated, each expected failure set is small enough
; to check by eye, and an unwired flag shows up as an ALL-GREEN run for that env —
; a loud, specific signal instead of a total that looks plausible.
;
; Deliberately written out in full rather than sharing a base section. The flag has
; to be visible on the line, because a mutation harness whose flag is not defined
; reports success in exactly the same shape as one that ran.
;
; Each mutation is also documented at the #ifdef that implements it. See
; test/README.md. Never built by env:native or env:pico32.

[env:mutant_cooldown_samples_through]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -DUNIT_TEST -DMUTANT_COOLDOWN_SAMPLES_THROUGH
lib_ignore = ICM42688P

