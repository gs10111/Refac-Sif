; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico32]
platform = espressif32
board = pico32
build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
framework = arduino
upload_speed = 921600
monitor_speed = 115200

; Host build for the pure (Arduino-free) modules under lib/.
; Run with:  pio test -e native
;
; src/ is deliberately NOT compiled here (test_build_src defaults to no) — it is
; the Arduino wiring layer. Anything worth unit-testing lives under lib/ and must
; not include Arduino.h, SPI.h, WiFi.h or esp_*; if it does, this build breaks,
; which is the point.
;
; The same test/ tree runs on target with `pio test -e pico32` for the checks that
; are genuinely hardware-only.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -DUNIT_TEST
lib_ignore = ICM42688P
